worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Upstream definitions
    # Using 127.0.0.1 because nginx runs directly on the host (not inside Docker)
    upstream nextjs {
        server 127.0.0.1:3000;
        keepalive 32;
    }
    upstream ai_service {
        server 127.0.0.1:8001;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    # Certbot uses this block for the ACME challenge (.well-known/acme-challenge)
    # and then redirects everything else to HTTPS.
    server {
        listen 80;
        server_name sudandna.com www.sudandna.com;

        # Allow Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS apex
        location / {
            return 301 https://sudandna.com$request_uri;
        }
    }

    # ── Main HTTPS server ──────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name sudandna.com www.sudandna.com;

        # Let's Encrypt certificates (placed here by Certbot)
        ssl_certificate     /etc/letsencrypt/live/sudandna.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sudandna.com/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # www → apex redirect
        if ($host = www.sudandna.com) {
            return 301 https://sudandna.com$request_uri;
        }

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "SAMEORIGIN"    always;
        add_header X-Content-Type-Options    "nosniff"       always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:;" always;

        client_max_body_size 50M;

        # ── Next.js static assets — served directly from disk (no Node.js needed) ──
        # These files are content-addressed (hash in filename) so cache forever.
        # IMPORTANT: adjust path if your project lives elsewhere.
        location /_next/static/ {
            alias /root/family-tree/.next/static/;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            gzip_static on;
        }

        # ── Next.js image optimisation endpoint ──────────────────────────────────
        location /_next/image {
            proxy_pass         http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Public folder — static files at root (favicon, robots.txt, etc.) ────
        location /public/ {
            alias /root/family-tree/public/;
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }

        # Google OAuth callback — separate rate limit so auth never gets blocked
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # AI microservice
        location /api/v1/ {
            proxy_pass         http://ai_service;
            proxy_http_version 1.1;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
            limit_req zone=api burst=10 nodelay;
        }

        # REST API — rate limited
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # Main Next.js app
        location / {
            proxy_pass         http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }
    }
}
