version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# Sudanese Heritage Platform – Docker Compose (Development)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: heritage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       heritage_db
      POSTGRES_USER:     heritage_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heritagepass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U heritage_user -d heritage_db"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Neo4j ──────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: heritage-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH:                                    "neo4j/${NEO4J_PASSWORD:-heritagegraph}"
      NEO4J_PLUGINS:                                 '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted:   "apoc.*"
      NEO4J_dbms_security_procedures_allowlist:      "apoc.*"
      NEO4J_server_memory_heap_initial__size:        "512m"
      NEO4J_server_memory_heap_max__size:            "1G"
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:     ["CMD-SHELL", "neo4j status | grep -q running || exit 1"]
      interval: 30s
      timeout:  15s
      retries:  5
      start_period: 60s

  # ── Redis (caching, sessions) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: heritage-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout:  5s
      retries:  3

  # ── Next.js App ─────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: heritage-web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL:   "postgresql://heritage_user:${POSTGRES_PASSWORD:-heritagepass}@postgres:5432/heritage_db"
      NEO4J_URI:      "bolt://neo4j:7687"
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-heritagegraph}"
      REDIS_URL:      "redis://:${REDIS_PASSWORD:-redispass}@redis:6379"
      AI_SERVICE_URL: "http://ai-service:8001"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:     ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 40s

  # ── AI Service ──────────────────────────────────────────────────────────────
  ai-service:
    build:
      context:    ./ai-service
      dockerfile: Dockerfile
    container_name: heritage-ai
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT:       "${NODE_ENV:-development}"
      AI_SERVICE_API_KEY: "${AI_SERVICE_API_KEY:-dev-key}"
      REDIS_URL:         "redis://:${REDIS_PASSWORD:-redispass}@redis:6379"
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:     ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout:  10s
      retries:  3

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: heritage-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - ai-service

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:

networks:
  default:
    name: heritage-network
